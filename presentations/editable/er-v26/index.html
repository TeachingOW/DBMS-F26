<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck</title><style>
:root{color-scheme:light;--ink:#14241c;--green:#0b5d3b;--gold:#c7a34a}*{box-sizing:border-box}body{margin:0;background:#e8ece8;color:var(--ink);font:18px/1.5 system-ui,sans-serif}.bar{height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #c9d2cb}.bar a{color:var(--green)}main{height:calc(100vh - 112px);max-width:1200px;margin:auto;padding:4vh 7vw;display:flex;flex-direction:column;justify-content:center;background:#fff}.eyebrow{font-size:.86rem;color:#51665a}.title{font-size:clamp(2rem,4vw,3.3rem);line-height:1.1;color:var(--green);margin:.2em 0 .6em}.body{font-size:clamp(1.05rem,1.6vw,1.45rem)}.body ul{padding-left:1.3em}.body li{margin:.45em 0}.tbl{border-collapse:collapse;width:100%;font-size:1rem}.tbl td,.tbl th{border:1px solid #9eafa3;padding:.55em;text-align:left}.tbl tr:first-child{background:#e6efe8;font-weight:650}.controls{height:54px;display:flex;align-items:center;justify-content:center;gap:18px}.controls button{font:inherit;padding:5px 15px}.notes{font-size:.9rem;color:#52645a;margin-top:1em}kbd{background:#fff;padding:2px 6px;border:1px solid #ccd4ce}
</style><header class="bar"><a href="../index.html">Course content</a><strong id="deck"></strong><span id="count"></span></header><main><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><article class="body" id="body"></article><div class="notes" id="notes"></div></main><nav class="controls"><button id="prev">← Previous</button><span id="status"></span><button id="next">Next →</button><button id="notesToggle">Speaker notes</button></nav><script>
fetch('deck.json').then(r=>r.json()).then(d=>{let i=0,notes=false;document.title=d.source_file;document.querySelector('#deck').textContent=d.source_file;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function draw(){let s=d.slides[i];document.querySelector('#eyebrow').textContent=`Slide ${s.number}${s.hidden?' · Hidden in source deck':''}`;document.querySelector('#title').textContent=s.title;document.querySelector('#count').textContent=`${i+1} / ${d.slides.length}`;document.querySelector('#status').textContent=`${i+1} of ${d.slides.length}`;document.querySelector('#body').innerHTML=s.content.map(b=>b.kind==='table'?'<table class="tbl">'+b.rows.map((r,j)=>'<tr>'+r.map(c=>j===0?'<th>'+esc(c)+'</th>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>':'<ul>'+b.paragraphs.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>').join('');document.querySelector('#notes').hidden=!notes;document.querySelector('#notes').textContent=notes?(s.speaker_notes||'No speaker notes on this slide.'):' ';document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===d.slides.length-1}function go(n){i=Math.max(0,Math.min(d.slides.length-1,n));draw()}document.querySelector('#prev').onclick=()=>go(i-1);document.querySelector('#next').onclick=()=>go(i+1);document.querySelector('#notesToggle').onclick=()=>{notes=!notes;draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft')go(i-1)});draw()});</script></html>
